# ------------------------------------------------------------------------------
GEOIP,CN,DIRECT

# 兜底匹配：未命中的海外未知流量走主代理
FINAL,🚀 节点选择

# ------------------------------------------------------------------------------
# 7. 科技狂动态策略组体系 (Proxy Group)
#    核心黑科技：通过 select = (.*) 自动吸纳小火箭中导入的全部节点！
# ------------------------------------------------------------------------------
[Proxy Group]
# 主代理选择器：支持手动自选节点，或默认走自动测速优选
🚀 节点选择 = select, ⚡ 自动优选, DIRECT

# 全自动测速组：自动抓取所有导入的节点，自动优选延迟最低者
⚡ 自动优选 = url-test, select = (.*), url = http://www.gstatic.com/generate_204, interval = 300, tolerance = 50

# AI 专属通道：优先走主代理，支持快速切自动优选或直连
🤖 AI平台 = select, 🚀 节点选择, ⚡ 自动优选, DIRECT

# 国际流媒体专线：自动优选跑满 4K 高清
📺 国际流媒体 = select, ⚡ 自动优选, 🚀 节点选择, DIRECT
