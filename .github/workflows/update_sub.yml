name: 自动更新聚合订阅配置 (Auto Update Clash Subscription)

on:
  schedule:
    # 每天 UTC 0点和12点自动更新一次 (北京时间 8:00 / 20:00)
    - cron: '0 0,12 * * *'
  push:
    branches:
      - main
    paths:
      - 'config.yaml'
      - 'config.example.yaml'
      - 'scripts/**'
  workflow_dispatch: # 支持手动点击一键立即触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码 (Checkout)
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行聚合生成脚本 (Generate Clash Profile)
        run: |
          python3 scripts/generate_clash.py

      - name: 提交并推送到仓库 (Commit & Push)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dist/clash.yaml
          if git diff --staged --quiet; then
            echo "配置无变动，跳过提交"
          else
            git commit -m "chore: 自动同步最新聚合订阅配置 [skip ci]"
            git push origin main
          fi
